<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="500" fill="#FFCC00"/>

  <!-- Subtle background kana watermarks -->
  <text x="860" y="130" font-size="140" fill="#FFCC00" stroke="#3F628C" stroke-width="1" opacity="0.10">あ</text>
  <text x="940" y="420" font-size="100" fill="#FFCC00" stroke="#3F628C" stroke-width="1" opacity="0.08">カ</text>

  <!-- LEFT: Branding -->
  <g transform="translate(56, 170)">
    <!-- App name -->
    <text x="0" y="0" font-size="46" font-weight="bold" fill="#3F628C">KanaCrono</text>

    <!-- Subtitle -->
    <text x="0" y="32" font-size="19" fill="#3F628C" opacity="0.8">Aprende Hiragana &amp; Katakana</text>

    <!-- Feature pills row -->
    <g transform="translate(0, 54)">
      <!-- Hiragana pill -->
      <rect x="0" y="-12" width="76" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="38" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500">Hiragana</text>

      <!-- Katakana pill -->
      <rect x="82" y="-12" width="76" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="120" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500">Katakana</text>

      <!-- Diacríticos pill -->
      <rect x="164" y="-12" width="92" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="210" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500">Diacríticos</text>

      <!-- Dígrafos pill -->
      <rect x="264" y="-12" width="76" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="302" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500">Dígrafos</text>
    </g>
  </g>

  <!-- RIGHT: App UI (no phone frame, floating on yellow) -->

  <!-- Timer bar -->
  <g transform="translate(680, 135)">
    <!-- Play icon -->
    <polygon points="14,36 14,50 24,43" fill="#888"/>
    <!-- Timer number -->
    <text x="52" y="47" font-size="20" fill="#888">5</text>
    <!-- Skip (double arrow) -->
    <polygon points="105,36 109,43 105,50" fill="#888"/>
    <polygon points="113,36 117,43 113,50" fill="#888"/>
  </g>

  <!-- Kana box (yellow) -->
  <rect x="680" y="210" width="270" height="230" rx="14" fill="#FFCC00"/>
  <!-- Kana character きゅ -->
  <text x="815" y="340" text-anchor="middle" font-size="96" fill="#333">きゅ</text>

  <!-- Romaji box (blue) -->
  <rect x="680" y="450" width="270" height="50" rx="14" fill="#3F628C"/>
  <!-- Romaji text -->
  <text x="795" y="483" text-anchor="middle" font-size="22" fill="#FFF" letter-spacing="1.5">kyu</text>

  <!-- Settings gear icon (bottom-right of romaji box) -->
  <g transform="translate(918, 462)">
    <circle cx="7" cy="7" r="5.5" fill="none" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="7" y1="0" x2="7" y2="2.5" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="7" y1="11.5" x2="7" y2="14" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="7" x2="2.5" y2="7" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="11.5" y1="7" x2="14" y2="7" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="3.05" y1="3.05" x2="4.83" y2="4.83" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="9.17" y1="9.17" x2="10.95" y2="10.95" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="10.95" y1="3.05" x2="9.17" y2="4.83" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
    <line x1="4.83" y1="9.17" x2="3.05" y2="10.95" stroke="#FFF" stroke-width="1.2" opacity="0.5"/>
  </g>
</svg>
