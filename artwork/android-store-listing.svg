<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="500" fill="#FFCC00"/>

  <!-- Decorative background kana (subtle) -->
  <text x="840" y="120" font-size="120" fill="#FFCC00" stroke="#3F628C" stroke-width="0.5" opacity="0.12" font-family="'Noto Sans JP', sans-serif">あ</text>
  <text x="920" y="410" font-size="90" fill="#FFCC00" stroke="#3F628C" stroke-width="0.5" opacity="0.10" font-family="'Noto Sans JP', sans-serif">カ</text>

  <!-- Left: Title area -->
  <g transform="translate(50, 160)">
    <!-- App name -->
    <text x="0" y="0" font-size="48" font-weight="700" fill="#3F628C" font-family="'Segoe UI', Roboto, Arial, sans-serif">KanaCrono</text>

    <!-- Subtitle -->
    <text x="0" y="34" font-size="20" fill="#3F628C" opacity="0.85" font-family="'Segoe UI', Roboto, Arial, sans-serif">Aprende Hiragana &amp; Katakana</text>

    <!-- Feature pills -->
    <g transform="translate(0, 56)">
      <rect x="0" y="-12" width="78" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="39" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500" font-family="'Segoe UI', Roboto, Arial, sans-serif">Hiragana</text>

      <rect x="84" y="-12" width="78" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="123" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500" font-family="'Segoe UI', Roboto, Arial, sans-serif">Katakana</text>

      <rect x="168" y="-12" width="94" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="215" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500" font-family="'Segoe UI', Roboto, Arial, sans-serif">Diacríticos</text>

      <rect x="268" y="-12" width="78" height="24" rx="12" fill="#3F628C" opacity="0.15"/>
      <text x="307" y="4" text-anchor="middle" font-size="11" fill="#3F628C" font-weight="500" font-family="'Segoe UI', Roboto, Arial, sans-serif">Dígrafos</text>
    </g>
  </g>

  <!-- Right: UI elements (no phone border) -->

  <!-- Timer bar -->
  <g transform="translate(680, 130)">
    <!-- Play triangle -->
    <polygon points="14,36 14,50 24,43" fill="#888"/>
    <!-- Timer number -->
    <text x="50" y="47" font-size="22" fill="#888" font-weight="400" font-family="'Segoe UI', Roboto, monospace">5</text>
    <!-- Skip (double arrow) -->
    <polygon points="105,36 109,43 105,50" fill="#888"/>
    <polygon points="113,36 117,43 113,50" fill="#888"/>
  </g>

  <!-- Kana box -->
  <rect x="680" y="205" width="270" height="230" rx="14" fill="#FFCC00"/>
  <text x="815" y="345" text-anchor="middle" font-size="100" fill="#333" font-family="'Noto Sans JP', sans-serif">きゅ</text>

  <!-- Romaji box -->
  <rect x="680" y="445" width="270" height="55" rx="14" fill="#3F628C"/>
  <text x="815" y="483" text-anchor="middle" font-size="26" fill="#FFFFFF" font-weight="500" letter-spacing="2" font-family="'Segoe UI', Roboto, sans-serif">kyu</text>

  <!-- Settings gear icon (bottom right of romaji) -->
  <g transform="translate(915, 460)">
    <circle cx="7" cy="7" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="7" y1="0" x2="7" y2="2.5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="7" y1="11.5" x2="7" y2="14" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="0" y1="7" x2="2.5" y2="7" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="11.5" y1="7" x2="14" y2="7" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="3.05" y1="3.05" x2="4.83" y2="4.83" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="9.17" y1="9.17" x2="10.95" y2="10.95" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="10.95" y1="3.05" x2="9.17" y2="4.83" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="4.83" y1="9.17" x2="3.05" y2="10.95" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
